<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>血狼 Blood Wolf</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="game-root"></div>
  <div id="moon-glow"></div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="hud-top">
      <div id="timer">00:00</div>
      <div id="kills">击杀 0</div>
    </div>
    <div id="announce"></div>
    <div id="boss-bar-wrap" class="hidden">
      <div id="boss-name">???</div>
      <div class="bar boss"><div id="boss-bar" class="fill"></div></div>
    </div>
    <div id="hud-bottom">
      <div id="weapon-list"></div>
      <div class="bar hp"><div id="hp-bar" class="fill"></div><span id="hp-text"></span></div>
      <div class="bar xp"><div id="xp-bar" class="fill"></div><span id="lv-text"></span></div>
      <div class="bar energy"><div id="energy-bar" class="fill"></div><span id="energy-text">血怒 [空格]</span></div>
    </div>
  </div>

  <!-- 升级三选一 -->
  <div id="levelup" class="overlay hidden">
    <h2>血月赐予 · 三选一</h2>
    <div id="cards"></div>
  </div>

  <!-- 开始界面 -->
  <div id="start-screen" class="overlay">
    <h1 class="title">血 狼</h1>
    <p class="subtitle">BLOOD WOLF · 血月下的求生</p>

    <div id="char-grid"></div>

    <div class="meta-row">
      <div class="moon-select">
        血月等级
        <button id="moon-minus" class="tiny-btn">−</button>
        <span id="moon-lv">1</span>
        <button id="moon-plus" class="tiny-btn">＋</button>
      </div>
      <div id="crystal-count"></div>
      <button id="talent-toggle" class="mp-btn">血脉天赋</button>
    </div>
    <div id="talent-panel" class="hidden"></div>

    <p class="controls">WASD / 方向键移动 · 空格释放主动技 · 手机端触屏拖动 · 生存 15 分钟后进入无尽模式</p>
    <button id="start-btn">单人 · 进入血月</button>
    <div class="mp-row">
      <button id="host-btn" class="mp-btn">创建联机房间</button>
      <input id="room-input" placeholder="输入房号" maxlength="12" />
      <button id="join-btn" class="mp-btn">加入房间</button>
    </div>
    <p id="mp-status" class="controls"></p>
  </div>

  <!-- 结算界面 -->
  <div id="end-screen" class="overlay hidden">
    <h1 id="end-title">你倒下了</h1>
    <div id="end-stats"></div>
    <button id="restart-btn">再战血月</button>
  </div>

  <div id="flash"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
